name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Remotion's headless browser is only needed for rendering, never for type-checking.
  REMOTION_SKIP_CHROMIUM_DOWNLOAD: '1'

jobs:
  hygiene:
    name: Hygiene + contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No secrets, no machine paths, no tracked blob > 5 MB.
      - run: node scripts/check-hygiene.mjs
      # RenderPlan fixtures and every preset must stay schema-valid.
      - run: node scripts/check-plan.mjs --all
      # Machine-checkable half of the visual quality standard.
      - run: node scripts/check-quality.mjs

  host:
    name: Host build + node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  remotion:
    name: Renderer typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit

  comfyui:
    name: ComfyUI nodes + contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tensor deps
        run: python -m pip install --upgrade pip numpy pillow
      - name: Run node tests (50 cases)
        run: bash comfyui-nodes/dsh-video-assets/tests/run_checks.sh
